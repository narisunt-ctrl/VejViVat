name: Deploy to GitHub Pages

# GitHub Pages serves this repo from the gh-pages branch, so every push to
# main is tested, built, and published there as a new gh-pages commit.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Checkout gh-pages Branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Production Assets
        run: npm run build

      - name: Publish to gh-pages
        working-directory: gh-pages
        run: |
          git rm -rq --ignore-unmatch .
          cp -r ../dist/. .
          find . -name '*.map' -not -path './.git/*' -delete
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "deploy: publish main ${GITHUB_SHA::7} to GitHub Pages"
          git push origin HEAD:gh-pages
